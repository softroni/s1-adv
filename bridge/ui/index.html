<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06070c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>S1 Bridge</title>
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

<header class="top">
  <div class="logo">S1</div>
  <div class="col"><h1>S1 Bridge</h1><span class="sub" id="topSub">Cardputer bridge</span></div>
  <div class="spacer"></div>
  <span class="pill" id="topPill"><span class="dot"></span><span>Checking…</span></span>
  <a class="iconbtn" href="#settings" title="Settings" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></a>
</header>

<nav class="side">
  <a href="#status" data-go="status"><svg class="i" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Status</a>
  <a href="#chat" data-go="chat"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Chat</a>
  <a href="#remote" data-go="remote"><svg class="i" viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="3"/><circle cx="12" cy="8" r="2"/><path d="M10 14h4M10 17h4"/></svg>Remote</a>
  <a href="#lab" data-go="lab"><svg class="i" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6L4.5 18.5A1.6 1.6 0 0 0 6 21h12a1.6 1.6 0 0 0 1.5-2.5L14 9V3"/><path d="M7 15h10"/></svg>Lab</a>
  <a href="#radio" data-go="radio"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M7 9L17 3M15 15h2M7 13.5a1.5 1.5 0 1 0 0 3a1.5 1.5 0 1 0 0-3"/></svg>Radio</a>
  <a href="#logs" data-go="logs"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Logs</a>
  <div class="grp">Bridge</div>
  <a href="#firmware" data-go="firmware"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 9h6v6H9zM9 1v4M15 1v4M9 19v4M15 19v4M1 9h4M1 15h4M19 9h4M19 15h4"/></svg>Firmware</a>
  <a href="#settings" data-go="settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Settings</a>
</nav>

<main>
  <section class="screen wide" id="status"><div class="empty">Loading…</div></section>
  <section class="screen" id="chat"><div class="chat" id="chatList"><div class="empty">Loading…</div></div><div style="height:150px"></div></section>
  <section class="screen" id="remote"></section>
  <section class="screen" id="lab"></section>
  <section class="screen" id="radio"></section>
  <section class="screen" id="logs"></section>
  <section class="screen" id="firmware"></section>
  <section class="screen" id="settings"></section>
</main>

<div class="composer" id="composer" hidden>
  <div class="box">
    <textarea id="chatInput" rows="1" placeholder="Message Claude…" maxlength="2000"></textarea>
    <button class="send" id="chatSend" aria-label="Send"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div>
  <div class="opts">Same conversation as the Cardputer: Claude's reply shows there too.</div>
</div>

<nav class="tabs">
  <a href="#status" data-go="status"><svg class="i" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Status</a>
  <a href="#chat" data-go="chat"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Chat</a>
  <a href="#remote" data-go="remote"><svg class="i" viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="3"/><circle cx="12" cy="8" r="2"/><path d="M10 14h4M10 17h4"/></svg>Remote</a>
  <a href="#lab" data-go="lab"><svg class="i" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6L4.5 18.5A1.6 1.6 0 0 0 6 21h12a1.6 1.6 0 0 0 1.5-2.5L14 9V3"/><path d="M7 15h10"/></svg>Lab</a>
  <a href="#radio" data-go="radio"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M7 9L17 3M15 15h2M7 13.5a1.5 1.5 0 1 0 0 3a1.5 1.5 0 1 0 0-3"/></svg>Radio</a>
  <a href="#logs" data-go="logs"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Logs</a>
</nav>
</div>
<script src="app.js"></script>
</body>
</html>
