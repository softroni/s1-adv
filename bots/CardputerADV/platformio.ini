[platformio]
default_envs = cardputer_adv

[env:cardputer_adv]
platform = espressif32@6.6.0
board = m5stack-stamps3
framework = arduino
extra_scripts = pre:scripts/vlc_provision.py
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.partitions = partitions_8mb_dual_ota.csv
board_upload.flash_size = 8MB
upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11

build_flags =
    -Wl,--wrap=esp_wifi_init
    -Wl,--wrap=esp_wifi_scan_start
    -Wl,--wrap=esp_wifi_set_ps
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_LOOP_STACK_SIZE=16384
    -D DEFAULT_FOCUS_LAMP_ENABLED=${sysenv.DEFAULT_FOCUS_LAMP_ENABLED}
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=3
    -D M5CARDPUTER
    -D DEVICE_TYPE=\"cardputer_adv\"
    -D DEVICE_NAME=\"ADV\ Cardputer\"
    -D APP_VERSION=\"0.2.330-dev\"
    -D BUILD_GIT_SHA=\"${sysenv.BUILD_GIT_SHA}\"
    -D BUILD_TIME=\"${sysenv.BUILD_TIME}\"
    -D DEFAULT_WIFI_SSID=\"${sysenv.DEFAULT_WIFI_SSID}\"
    -D DEFAULT_WIFI_PASSWORD=\"${sysenv.DEFAULT_WIFI_PASSWORD}\"
    -D DEFAULT_HUB_HOST=\"${sysenv.DEFAULT_HUB_HOST}\"
    -D DEFAULT_HUB_PORT_STR=\"${sysenv.DEFAULT_HUB_PORT}\"
    -D DEFAULT_DEVICE_ID=\"${sysenv.DEFAULT_DEVICE_ID}\"
    -D DEFAULT_DEVICE_TOKEN=\"${sysenv.DEFAULT_DEVICE_TOKEN}\"
    -D DEFAULT_TOPIC_KEY=\"${sysenv.DEFAULT_TOPIC_KEY}\"
    -std=gnu++17
    ; TV Remote's Bluetooth keyboard is out of the image: linking it cost every app 17.5 KB of heap
    ; and HTTPS stopped working (0.2.307). With 1, also restore NimBLE-Arduino in lib_deps.
    -D TV_REMOTE_BLUETOOTH=0
    ; With it: one connection, as a peripheral only, so the stack stays small.
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -D CONFIG_BT_NIMBLE_MAX_BONDS=4

lib_deps =
    m5stack/M5Cardputer@1.1.1
    ; TV Remote's Bluetooth keyboard, only with TV_REMOTE_BLUETOOTH=1 in build_flags.
    ; h2zero/NimBLE-Arduino@2.5.2
    m5stack/M5Unified@0.2.26
    m5stack/M5Unit-NFC@0.1.2
    m5stack/M5UnitUnified@0.6.4
    m5stack/M5Utility@0.3.1
    m5stack/M5HAL@0.1.4
    m5stack/M5GFX@0.2.33
    bblanchon/ArduinoJson@6.21.6
    links2004/WebSockets@2.7.3
    z3t0/IRremote@4.7.1
    miguelbalboa/MFRC522@1.4.12
    jgromes/RadioLib@7.7.1
    nanopb/Nanopb@0.4.92
    ; libmeshtastic-leaf is in lib/, with a patch (lib/libmeshtastic-leaf/S1-ADV-PATCHES.md). Its Crypto stays pinned here.
    https://github.com/meshtastic/Crypto/archive/591ff9a690e8168ccb7a36abde8d7783e448d395.zip
